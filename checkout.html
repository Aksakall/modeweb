<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Güvenli Sipariş | Sıla Sarıoğlu</title><meta name="description" content="Teslimat ve ödeme tercihinizi belirleyerek siparişinizi tamamlayın."><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="checkout.css"></head><body><nav class="checkout-nav"><a class="brand" href="index.html">Sıla Sarıoğlu</a><a href="index.html#urunler">Alışverişe Dön</a></nav><main class="checkout-shell"><section class="checkout-main"><h1>Siparişini tamamla</h1><div class="checkout-steps"><span class="active">01 Sepet</span><span class="active">02 Bilgiler</span><span>03 Teslimat</span><span>04 Ödeme</span><span>05 Onay</span></div><form class="checkout-form" id="checkout-form"><div class="field"><label for="fullName">Ad Soyad</label><input id="fullName" name="fullName" autocomplete="name" required></div><div class="field"><label for="phone">Telefon</label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div><div class="field full"><label for="email">E-posta</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="city">İl</label><input id="city" name="city" autocomplete="address-level1" required></div><div class="field"><label for="district">İlçe</label><input id="district" name="district" autocomplete="address-level2" required></div><div class="field full"><label for="address">Açık Adres</label><textarea id="address" name="address" autocomplete="street-address" required></textarea></div><div class="field full"><label for="deliveryMethod">Teslimat Seçimi</label><select id="deliveryMethod" name="deliveryMethod"><option value="standard">Standart Kargo</option></select></div><div class="payment-options"><h2>Ödeme Tercihi</h2><label class="payment-option"><input type="radio" name="paymentMethod" value="cash_on_delivery" checked><span>Kapıda Ödeme — Nakit<small>Sipariş tutarı teslimat sırasında ödenir.</small></span></label><label class="payment-option"><input type="radio" name="paymentMethod" value="card_on_delivery"><span>Kapıda Ödeme — Kredi Kartı<small>Mobil POS uygunluğu sipariş onayında bildirilir.</small></span></label><label class="payment-option"><input type="radio" name="paymentMethod" value="bank_transfer"><span>Havale / EFT<small>Hesap bilgileri sipariş sonrasında paylaşılır.</small></span></label><label class="payment-option"><input type="radio" name="paymentMethod" value="online_card" disabled><span>Online Kart Ödeme<small>Güvenli ödeme sağlayıcısı etkinleştirildiğinde kullanıma açılacaktır.</small></span></label></div><div class="field full"><label for="note">Sipariş Notu</label><textarea id="note" name="note" maxlength="500"></textarea></div><p class="checkout-status" id="checkout-status" role="status"></p><button class="checkout-submit" type="submit">Siparişi Onayla</button></form></section><aside class="order-summary"><h2>Sepet Özeti</h2><div id="summary-items"></div><div class="summary-totals"><div><span>Ara Toplam</span><strong id="subtotal"></strong></div><div><span>Kargo</span><strong id="cargo"></strong></div><div class="total"><span>Toplam</span><strong id="total"></strong></div></div></aside></main><script src="config/runtime-env.local.js"></script><script type="module" src="checkout.js"></script></body></html>
